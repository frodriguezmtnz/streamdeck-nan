name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@11.13.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Validate release versions before packaging
        run: node scripts/release-contract.mjs "$GITHUB_REF_NAME" versions
      - run: pnpm check:workspace
      - run: pnpm test:workspace
      - run: pnpm build
      - name: Build universal NaN Keychain helper
        run: pnpm build:nan-keychain
      - name: Sign and verify universal NaN Keychain helper
        run: node scripts/sign-nan-keychain.mjs
        env:
          APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64: "${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}"
          APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD: "${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}"
          APPLE_DEVELOPER_ID_APPLICATION_IDENTITY: "${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_IDENTITY }}"
          APPLE_DEVELOPER_ID_TEAM_ID: "${{ secrets.APPLE_DEVELOPER_ID_TEAM_ID }}"
      - run: pnpm scan:secrets
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env: { GITHUB_TOKEN: "${{ github.token }}" }
      - name: Package immutable staged plugin
        run: pnpm release:pack:verify
      - name: Notarize immutable staged plugin
        run: node scripts/notarize-streamdeck.mjs dist/*.streamDeckPlugin
        env:
          APPLE_APP_STORE_CONNECT_API_KEY_P8_BASE64: "${{ secrets.APPLE_APP_STORE_CONNECT_API_KEY_P8_BASE64 }}"
          APPLE_APP_STORE_CONNECT_KEY_ID: "${{ secrets.APPLE_APP_STORE_CONNECT_KEY_ID }}"
          APPLE_APP_STORE_CONNECT_ISSUER_ID: "${{ secrets.APPLE_APP_STORE_CONNECT_ISSUER_ID }}"
      - name: Verify notarized release bytes
        run: |
          (cd dist && shasum -a 256 *.streamDeckPlugin > SHA256SUMS)
          node scripts/release-contract.mjs "$GITHUB_REF_NAME"
          git diff --exit-code -- com.barbatdev.ai-usage.sdPlugin/manifest.json com.barbatdev.ai-usage.sdPlugin/bin/plugin.js
      - name: Upload verified release bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ github.ref_name }}
          path: |
            dist/*.streamDeckPlugin
            dist/NOTARIZATION.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Download verified release bytes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ github.ref_name }}
          path: dist
      - name: Re-verify downloaded bytes and publish draft
        run: |
          printf '%s\n' '${{ github.token }}' | gh auth login --with-token
          node scripts/release-contract.mjs "$GITHUB_REF_NAME"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = "true" || { echo "refusing to replace assets on a published release"; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --draft
          fi
          plugin="$(basename dist/*.streamDeckPlugin)"
          node scripts/release-assets.mjs "$GITHUB_REF_NAME" clean "$plugin" SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" dist/*.streamDeckPlugin dist/SHA256SUMS --clobber
          node scripts/release-assets.mjs "$GITHUB_REF_NAME" exact "$plugin" SHA256SUMS
