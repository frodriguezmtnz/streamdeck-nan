name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false, fetch-depth: 0 }

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@11.13.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and Stream Deck validation
        run: pnpm check:workspace

      - name: Run tests (workspace)
        run: pnpm test:workspace

      - name: Verify plugin bundle is tracked
        run: git ls-files --error-unmatch -- com.refactor-ia.nan.sdPlugin/bin/plugin.js

      - name: Build plugin bundle
        run: pnpm build

      - name: Verify bundle parity (rebuild == committed)
        run: |
          # Rebuild and check for diff. If different, the bundle wasn't committed.
          pnpm build
          if ! git diff --quiet -- com.refactor-ia.nan.sdPlugin/bin/plugin.js; then
            echo "::error::bundle rebuild produced a different bin/plugin.js. Run \`pnpm build\` and commit the result."
            exit 1
          fi
        shell: bash

      - name: Secret scan (pre-built binary)
        run: pnpm scan:secrets

      - name: Gitleaks scan
        uses: ./.github/actions/gitleaks

      - name: Verify release packaging contract
        run: |
          node scripts/release-contract.mjs "v$(node -p "require('./package.json').version")" versions
          node -e "require('node:fs').rmSync('dist', { recursive: true, force: true })"
          pnpm build:nan-keychain
          test -x com.refactor-ia.nan.sdPlugin/bin/nan-keychain
          pnpm release:pack:verify
          (cd dist && shasum -a 256 *.streamDeckPlugin > SHA256SUMS)
          node scripts/release-contract.mjs "v$(node -p "require('./package.json').version")" unsigned-ci

  windows-build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@11.13.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and Stream Deck validation
        run: pnpm check:workspace

      - name: Build plugin bundle and Windows DPAPI helper
        run: pnpm build

      - name: Verify Windows DPAPI helper is staged
        run: test -f com.refactor-ia.nan.sdPlugin/bin/nan-dpapi.ps1
        shell: bash

      - name: Diagnose the DPAPI helper (temporary)
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/dpapi-diagnose.mjs" <<'EOF'
          import { spawn } from "node:child_process";

          const helper = "native/nan-dpapi/nan-dpapi.ps1";
          const powerShell = `${process.env.SystemRoot}\\System32\\WindowsPowerShell\\v1.0\\powershell.exe`;
          const args = ["-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", helper];
          const names = ["SystemRoot", "windir", "SystemDrive", "TEMP", "TMP", "USERPROFILE", "LOCALAPPDATA", "APPDATA", "COMSPEC", "PATHEXT"];

          function probe(env) {
            return new Promise((resolve) => {
              const started = Date.now();
              const child = spawn(powerShell, args, { env, shell: false, stdio: ["pipe", "pipe", "pipe"], windowsHide: true });
              let stdout = "";
              let stderr = "";
              let settled = false;
              const finish = (message) => {
                if (settled) return;
                settled = true;
                resolve({ message, ms: Date.now() - started, stdout, stderr });
              };
              child.stdout.on("data", (chunk) => { stdout += chunk; });
              child.stderr.on("data", (chunk) => { stderr += chunk; });
              child.on("error", (error) => finish(`spawn-error ${error.message}`));
              child.on("close", (code) => finish(`exit ${code}`));
              child.stdin.end('{"operation":"get"}\n');
              setTimeout(() => { child.kill(); finish("timeout"); }, 6_000);
            });
          }

          const restricted = {};
          for (const name of names) if (process.env[name] !== undefined) restricted[name] = process.env[name];

          console.log("restricted-keys", JSON.stringify(Object.keys(restricted).sort()));
          console.log("restricted-values", JSON.stringify(restricted));

          const missing = Object.keys(process.env).filter((name) => !(name in restricted));
          console.log("missing-count", missing.length, JSON.stringify(missing.sort()));

          const restrictedResult = await probe(restricted);
          console.log("restricted", restrictedResult.message, restrictedResult.ms, JSON.stringify(restrictedResult.stdout), JSON.stringify(restrictedResult.stderr.slice(0, 300)));
          const fullResult = await probe({ ...process.env });
          console.log("full", fullResult.message, fullResult.ms, JSON.stringify(fullResult.stdout), JSON.stringify(fullResult.stderr.slice(0, 300)));

          if (restrictedResult.message === "timeout" && fullResult.message.startsWith("exit 0")) {
            let current = missing;
            while (current.length > 1) {
              const half = Math.ceil(current.length / 2);
              const first = current.slice(0, half);
              const second = current.slice(half);
              const withFirst = { ...restricted, ...Object.fromEntries(first.map((name) => [name, process.env[name]])) };
              const withSecond = { ...restricted, ...Object.fromEntries(second.map((name) => [name, process.env[name]])) };
              const firstResult = await probe(withFirst);
              const secondResult = await probe(withSecond);
              console.log(`bisect ${current.length}: first=${firstResult.message} second=${secondResult.message}`, JSON.stringify(first), JSON.stringify(second));
              if (firstResult.message.startsWith("exit 0")) current = first;
              else if (secondResult.message.startsWith("exit 0")) current = second;
              else { console.log("need-combined-set"); break; }
            }
            console.log("candidate", JSON.stringify(current));
          }
          EOF
          node "$RUNNER_TEMP/dpapi-diagnose.mjs"

      - name: Run tests (Windows)
        run: node scripts/run-tests.mjs

      - name: Secret scan (pre-built binary)
        run: pnpm scan:secrets

  markdown-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@11.13.0 --activate
      - run: pnpm check:links
      - name: Check release artifacts
        run: test -f LICENSE && test -f SECURITY.md && test -f com.refactor-ia.nan.sdPlugin/LICENSE
