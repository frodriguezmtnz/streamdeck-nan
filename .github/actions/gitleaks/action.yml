name: Gitleaks
description: Scan the full Git history with a pinned Gitleaks CLI
runs:
  using: composite
  steps:
    - name: Scan full history
      shell: bash
      run: |
        set -euo pipefail

        if [ "${GITHUB_ACTIONS:-}" != "true" ]; then
          echo "Gitleaks CLI download is allowed only on GitHub Actions" >&2
          exit 1
        fi
        : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
        : "${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is required}"

        case "$(uname -s)" in
          Darwin) ;;
          *)
            echo "Unsupported operating system for the pinned Gitleaks CLI: $(uname -s)" >&2
            exit 1
            ;;
        esac

        version="8.30.1"
        case "$(uname -m)" in
          arm64)
            asset="arm64"
            sha256="b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5"
            ;;
          x86_64)
            asset="x64"
            sha256="dfe101a4db2255fc85120ac7f3d25e4342c3c20cf749f2c20a18081af1952709"
            ;;
          *)
            echo "Unsupported architecture for the pinned Gitleaks CLI: $(uname -m)" >&2
            exit 1
            ;;
        esac

        temp_dir="$(mktemp -d "${RUNNER_TEMP:?}/gitleaks.XXXXXXXX")"
        trap 'rm -rf "$temp_dir"' EXIT
        archive="$temp_dir/gitleaks_${version}_darwin_${asset}.tar.gz"
        url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_darwin_${asset}.tar.gz"

        curl --fail --show-error --location \
          --proto '=https' --proto-redir '=https' \
          --connect-timeout 15 --max-time 120 --max-filesize 104857600 \
          --retry 3 --retry-all-errors \
          --output "$archive" "$url"
        printf '%s  %s\n' "$sha256" "$archive" | shasum -a 256 -c -
        tar -xzf "$archive" -C "$temp_dir" --no-same-owner --no-same-permissions gitleaks
        binary="$temp_dir/gitleaks"
        test -x "$binary"
        cd "$GITHUB_WORKSPACE"
        "$binary" git --config .gitleaks.toml --redact --log-opts="--all" .
